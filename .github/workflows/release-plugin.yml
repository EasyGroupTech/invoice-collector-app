name: Release ic-email-to-downloads

# The most frequently-changing of the three (§11) — a real, downloadable plugin bundle attached
# to its own GitHub Release, independent of any app or SDK release, so it can be updated without
# a full app release (exactly the point of §11 item 2).
on:
  push:
    tags:
      - 'plugin-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # required for attest-build-provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Deliberately NOT `npm install -g npm@latest` here, unlike release-sdk.yml — that upgrade
      # is only genuinely needed for OIDC trusted-publishing support, which this workflow never
      # uses. Confirmed live it actively causes a *different* real regression here: upgrading to
      # npm 12.x changed `npm ls`'s own workspace-scoping behavior enough that `cyclonedx-npm
      # --workspace ic-email-to-downloads` started picking up an unrelated sibling workspace's own
      # dev-tooling dependency (ic-core's tailwindcss → lightningcss, MPL-2.0) as if it belonged to
      # this package's tree — a real false positive, not a genuine finding about this plugin's own
      # (much smaller) real dependencies. Reproduced by hand: npm 11.3.0 scans this correctly;
      # npm@latest (12.x) doesn't. Whatever npm ships bundled with `node-version: 22` is fine —
      # the earlier `generate-sbom: not found` failure this step was originally added to work
      # around is already fixed for real by invoking generate-sbom-cli.js directly via `node`
      # (package.json's own generate-sbom:* scripts), which needs no particular npm version at all.

      # Real, confirmed-live failure otherwise: ic-email-to-downloads depends on
      # invoice-collector-plugin-sdk via the npm workspace symlink, resolved against its *built*
      # dist/ output, not its source — `npm run typecheck -w ic-email-to-downloads` run on its
      # own (unlike the root `typecheck` script, which builds the SDK first) hit a real
      # "Cannot find module 'invoice-collector-plugin-sdk'" on a fresh CI checkout with no dist/
      # yet.
      - run: npm run build -w invoice-collector-plugin-sdk

      - run: npm run typecheck -w ic-email-to-downloads
      - run: npm test -w ic-email-to-downloads
      - run: npm run package:plugin

      # §9.1's real requirement: installPlugin() refuses an open-source-tier package (this one
      # declares `repository`) without a verified GitHub Artifact Attestation for the exact
      # artifact bytes. Generated here, against the real zip this same job just built — not a
      # fake standing in for it, unlike this repo's own unit/E2E tests.
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'packages/ic-email-to-downloads/release/*.zip'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            packages/ic-email-to-downloads/release/*.zip \
            --title "ic-email-to-downloads ${{ github.ref_name }}" \
            --generate-notes
