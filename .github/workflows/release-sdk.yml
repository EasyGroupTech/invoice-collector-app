name: Release SDK

# §11's own "three distinct outputs, versioned independently" design (docs/architecture-design.md)
# — the SDK is the rarest-changing of the three, published to npm on its own tag prefix so it
# never has to wait on (or drag along) a core or plugin release. sdk-vX.Y.Z only ever publishes to
# npm; there's no GitHub Release for it — npm is its real distribution channel.
#
# Publishes via npm's own Trusted Publishing (OIDC) — no NPM_TOKEN secret at all, nothing to leak
# or rotate. Requires the package to already exist on the registry first (npm's own real
# limitation, unlike PyPI: trusted publishing can't be configured for a name that's never been
# published) — the very first sdk-v* release is a one-time manual `npm publish` from the
# maintainer's own machine; every one after this is configured, at
# https://www.npmjs.com/package/invoice-collector-plugin-sdk/access, to trust exactly this repo +
# this workflow file.
#
# STAGED, NOT DIRECT — this job only ever runs `npm stage publish`, never `npm publish`, matching
# the trusted-publisher config's own "staged publishing only" setting (npm's own recommended,
# more secure default — confirmed live: a config left open to direct `npm publish` got a real
# `403 OIDC permission denied for this action`, deliberately kept restricted rather than relaxed
# to work around it). Staging never needs 2FA, even from unattended CI, because it can't make
# anything public by itself — a *human* still has to review and approve the staged tarball
# afterward, on https://www.npmjs.com/package/invoice-collector-plugin-sdk (the "Staged Packages"
# tab) or via `npm stage approve <stage-id>`, and *that* step does require real 2FA (a security
# key taps fine there — it's a live, interactive action, unlike an unattended CI publish).
#
# ⚠️ REMEMBER: pushing an sdk-v* tag alone does NOT actually release anything — this workflow only
# gets the release as far as "staged." Nothing is live on npm until someone approves it by hand.
on:
  push:
    tags:
      - 'sdk-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing (and the provenance attestation it produces automatically)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Real, confirmed-live failure otherwise: `node-version: 22` only guarantees whatever npm
      # ships bundled with that Node release, which can predate the 11.5.1 minimum trusted
      # publishing actually needs — the CLI then silently skips the OIDC exchange and attempts a
      # plain unauthenticated publish, which the registry reports back as a plain 404 (not a
      # clearer auth error). Pin a known-good npm explicitly rather than trusting whatever Node
      # 22 happens to bundle this month.
      - run: npm install -g npm@latest

      - run: npm run typecheck -w invoice-collector-plugin-sdk
      - run: npm run build -w invoice-collector-plugin-sdk
      - run: npm test -w invoice-collector-plugin-sdk

      # prepack (package.json's own hook) copies the root LICENSE in. No NODE_AUTH_TOKEN — the
      # npm CLI auto-detects the OIDC environment and authenticates via the trusted-publisher
      # config instead. `npm stage publish`, not `npm publish` — see the file-level comment above
      # for why; this only ever gets the release as far as "staged," never live on its own.
      - run: npm stage publish -w invoice-collector-plugin-sdk --access public

      # Default (not `if: always()`) — only worth reminding about approval if staging itself
      # actually succeeded; a failed `npm stage publish` left nothing to go approve at all.
      - name: Remind that a human still needs to approve this
        run: |
          echo "## ⚠️ Action required: approve the staged SDK release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow only staged the release — nothing is live on npm yet." >> "$GITHUB_STEP_SUMMARY"
          echo "Go to https://www.npmjs.com/package/invoice-collector-plugin-sdk (Staged Packages tab) and approve it, or run \`npm stage approve <stage-id>\` yourself (2FA required either way)." >> "$GITHUB_STEP_SUMMARY"
